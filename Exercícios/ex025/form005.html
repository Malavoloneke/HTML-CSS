<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php">
        <fieldset>
            <legend>Sexo</legend>
            <p>
                <input type="radio" name="sexo" id="ixmas"> <label for="ixmas">Masculino</label> <br>
                <input type="radio" name="sexo" id="ixfem"> <label for="ixfem">Femenino</label>
            </p>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <p>
                <input type="checkbox" name="esbas" id="iesbas"> <label for="iesbas">Basquete</label>
                <input type="checkbox" name="esfut" id="iesfut"> <label for="iesfut">Futebol</label>
                <input type="checkbox" name="esand" id="iesand"> <label for="iesand">Andebol</label>
                <input type="checkbox" name="esvol" id="iesvol"> <label for="iesvol">Voleibol</label>
            </p>
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
